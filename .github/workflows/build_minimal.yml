name: Minimal Build

# 精简版构建：按需选择目标 + 链接方式 + 前端变体 + 是否 UPX 压缩。
# 触发：推送到 feat/zhijiadisk 分支，或手动 workflow_dispatch（见 on:）。
#
# 与 build.yml 的区别：
#   1. matrix 不同（这里用 include 逐条列举，方便注释掉不想要的目标）
#   2. 新增两种非静态-链接的 linux 变体（见下）
#   3. 新增 lite 前端变体
#   4. 新增 UPX 压缩变体
#   5. 新增 WebDAV 产物上传
#   6. 新增「汇总」job：等全部变体跑完后，把各变体各自生成的单变体 txt
#      删掉，换成一份按代理域名分组、列出该 Release 全部产物的 proxy.txt
#
# 下载地址 txt 的两个阶段（WebDAV <WEBDAV_DIR>/<commit>/）：
#   构建中：25 份 openlist_<变体>.txt，各自只含自己那个产物。
#           目的 —— 某个变体一编译完即可拿到加速下载地址，
#           不必等其它 24 个变体跑完。这是本 workflow 刻意的过渡态。
#   结束后：删除上面全部，只留一份 proxy.txt，列出成功的全部产物，
#           并把它作为正文发一封邮件。
#           build 失败/被 cancel 时 summarize 不跑，过渡态就是最终态，
#           此时至少每份 txt 对应的产物都是真实存在且可用的。
#
# 邮件配置（仓库 Settings → Secrets and variables → Actions 里加）：
#   vars.SMTP_HOST          SMTP 服务器，如 smtp.qq.com
#   vars.SMTP_PORT          可选，默认 465（隐式 SSL）；其它值走 STARTTLS
#   vars.MAIL_FROM          可选，默认取 SMTP_USERNAME
#   secrets.MAIL_TO         收件人，多个用逗号分隔
#   secrets.SMTP_USERNAME   登录用户（通常就是发件邮箱）
#   secrets.SMTP_PASSWORD   密码 / 授权码 —— 多数邮箱要用「SMTP 授权码」，
#                           不是网页登录密码，用错会得到 535 认证失败。
#   任一项缺失时脚本打 notice 后正常返回，不视为构建失败。
#
# 链接方式说明（务必看，选错会白跑）：
#   linux-*-musl     musl 工具链 + CGO，-static 全静态。体积最大，兼容性最好。
#   linux-*          xgo（docker glibc）+ CGO，动态链接。需目标机 glibc >= 构建镜像。
#   linux-*-nocgo    CGO_ENABLED=0 纯 Go，不含任何 libc。通常比 musl 版还小，
#                    且无 glibc 版本要求；amd64/arm64 上 sqlite 走 glebarez 纯 Go 驱动。
#                    ⚠ 此变体无法走 cgo-actions（它会强制 CGO_ENABLED=1），
#                      由下面的 "Build (pure Go)" 步骤直接用 go build 完成。
#
# 体积提醒：二进制的绝对大头是 go:embed 进去的前端 dist（标准版 ~55MB）。
#   lite 前端对该体积的影响远大于链接方式，想瘦身优先看 lite 那条。
#
# UPX 说明：只对 linux 生效（windows 不做，原因见 "Compress with UPX" 步骤注释）。
#   当前 matrix 对 musl / glibc / nocgo 三种链接方式都开了 UPX。
#   但压缩率差别很大：纯 Go(nocgo) 产物收益明显，musl/glibc 产物收益很小
#   —— 体积大头是**已经压缩过**的前端 dist，再压一遍榨不出多少。
#   所以 UPX 让变体数翻倍，换来的体积收益有限；真要瘦身请看 lite 前端。
#
# 不需要的目标/变体，直接把 include 里对应那两行注释掉即可。

on:
  # 推送到 feat/zhijiadisk 分支就自动触发。
  # 想改分支只改这一行；想再支持别的分支就加成列表：
  #   branches: [feat/zhijiadisk, other-branch]
  push:
    branches: [feat/zhijiadisk]
  # 保留手动触发，方便不改代码就重跑一次。
  workflow_dispatch:

concurrency:
  # 同一分支连推两次会取消上一次运行（cancel-in-progress）。
  # ⚠ 被取消的运行可能已经建好 ci-<sha> Release、传了部分 asset 就停了，
  #   且不会再补齐（summarize 也不会跑）—— 那个 commit 的 Release 是残缺的。
  #   要完整产物，等上一次跑完再推，或对残缺的 commit 手动重跑一次。
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 创建 Release 需要写权限。GITHUB_TOKEN 默认是只读的，
# 不显式声明会在 gh release create / release upload 时得到 403。
permissions:
  contents: write

jobs:
  build:
    strategy:
      # 某个变体失败时不要连坐取消其它变体，便于一次跑完看对比。
      fail-fast: false
      matrix:
        include:
          # ---- Windows 10+ x86-64（产物 openlist.exe）----
          - target: windows-amd64
            frontend: full
            compress: none

          # ---- Linux，musl 全静态（原有）----
          - target: linux-amd64-musl
            frontend: full
            compress: none
          - target: linux-arm64-musl
            frontend: full
            compress: none

          # ---- Linux，glibc 动态链接（新增）----
          - target: linux-amd64
            frontend: full
            compress: none
          - target: linux-arm64
            frontend: full
            compress: none

          # ---- Linux，纯 Go 零依赖 CGO_ENABLED=0（新增）----
          - target: linux-amd64-nocgo
            frontend: full
            compress: none
          - target: linux-arm64-nocgo
            frontend: full
            compress: none

          # ---- lite 前端变体（体积大头在这里）----
          - target: linux-amd64-musl
            frontend: lite
            compress: none
          - target: linux-arm64-musl
            frontend: lite
            compress: none
          - target: linux-amd64
            frontend: lite
            compress: none
          - target: linux-arm64
            frontend: lite
            compress: none
          - target: linux-amd64-nocgo
            frontend: lite
            compress: none
          - target: linux-arm64-nocgo
            frontend: lite
            compress: none

          # ---- UPX 压缩变体（仅 linux；三种链接方式 × 两种前端 = 12 条）----
          # 想让变体数减半、只保留收益较大的 nocgo 那几条，
          # 把 musl / glibc 对应的行注释掉即可（详见文件头的 UPX 说明）。
          - target: linux-amd64-musl
            frontend: full
            compress: upx
          - target: linux-arm64-musl
            frontend: full
            compress: upx
          - target: linux-amd64
            frontend: full
            compress: upx
          - target: linux-arm64
            frontend: full
            compress: upx
          - target: linux-amd64-nocgo
            frontend: full
            compress: upx
          - target: linux-arm64-nocgo
            frontend: full
            compress: upx
          - target: linux-amd64-musl
            frontend: lite
            compress: upx
          - target: linux-arm64-musl
            frontend: lite
            compress: upx
          - target: linux-amd64
            frontend: lite
            compress: upx
          - target: linux-arm64
            frontend: lite
            compress: upx
          - target: linux-amd64-nocgo
            frontend: lite
            compress: upx
          - target: linux-arm64-nocgo
            frontend: lite
            compress: upx

    name: Build ${{ matrix.target }} (${{ matrix.frontend }}, ${{ matrix.compress }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 与 release.yml 一致：浅克隆但要取 tag，
          # 否则 git describe 拿不到版本号。
          fetch-depth: 1
          fetch-tags: true

      - uses: benjlevesque/short-sha@dbe07338b37c456ce06d23409b35a56a7815eef4 # v4.0
        id: short-sha

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.1"

      - name: Setup web
        # release -> FetchWebRelease：拉前端最新**稳定** release，
        # 而非 dev 走的 edge 滚动通道。
        # lite 参数会让 FetchWebRelease 挑 openlist-frontend-dist-lite 那个包。
        run: |
          if [ "${{ matrix.frontend }}" = "lite" ]; then
            bash build.sh release lite web
          else
            bash build.sh release web
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRONTEND_REPO: ${{ vars.FRONTEND_REPO }}

      - name: Build (cgo)
        # nocgo 变体走下面独立的 go build 步骤，这里跳过。
        if: ${{ !contains(matrix.target, '-nocgo') }}
        uses: OpenListTeam/cgo-actions@6fcace5934c36d70503dba06e2396bb58b766130 # v1.2.5
        with:
          targets: ${{ matrix.target }}
          # 仍按原名分流：只有 -musl 才加静态链接 flag。
          # 不带 -musl 的 linux-amd64 / linux-arm64 会命中 '-ldflags=' 分支，
          # 交给 xgo 按 glibc 动态链接处理。
          flags: ${{ contains(matrix.target, '-musl') && '-ldflags=-linkmode external -extldflags ''-static -fpic''' || '-ldflags=' }}
          static-link-for-musl: true
          musl-target-format: $os-$musl-$arch
          github-token: ${{ secrets.GITHUB_TOKEN }}
          out-dir: build
          x-flags: |
            github.com/OpenListTeam/OpenList/v4/internal/conf.BuiltAt=$built_at
            github.com/OpenListTeam/OpenList/v4/internal/conf.GitAuthor=The OpenList Projects Contributors <noreply@openlist.team>
            github.com/OpenListTeam/OpenList/v4/internal/conf.GitCommit=$git_commit
            github.com/OpenListTeam/OpenList/v4/internal/conf.Version=$tag
            github.com/OpenListTeam/OpenList/v4/internal/conf.WebVersion=rolling
          output: openlist$ext

      - name: Build (pure Go, CGO_ENABLED=0)
        # 纯 Go 静态二进制：不经任何 C 工具链，因此不需要交叉编译器，
        # 也不受目标机 glibc 版本限制。
        if: ${{ contains(matrix.target, '-nocgo') }}
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          TARGET: ${{ matrix.target }}
        run: |
          set -e
          arch="${TARGET#linux-}"; arch="${arch%%-*}"
          export GOARCH="$arch"

          # 与 cgo-actions 的 x-flags 保持一致，只是这里要自己拼。
          # Version 取 GITHUB_REF_NAME（runner 自带的环境变量，本 workflow
          # 由分支触发，即分支名），不走 Actions 表达式展开：脚本内容固定，
          # 不受 ref 名里可能出现的 shell 元字符影响。
          # （注意：本注释里不能写那种表达式字面量 —— 哪怕在 shell 注释里，
          #   Actions 也会先解析，空表达式会让整个 workflow 校验失败。）
          # ⚠ cgo 那侧走的是 cgo-actions 的 $tag，两者不一定相等 ——
          #   想让同名变体自报一致，需要核对 cgo-actions 里 $tag 的实际取值。
          LDFLAGS="-w -s \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.BuiltAt=$(date +'%F %T %z')' \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.GitAuthor=The OpenList Projects Contributors <noreply@openlist.team>' \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.GitCommit=$(git rev-parse HEAD)' \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.Version=${GITHUB_REF_NAME}' \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.WebVersion=rolling'"

          # 纯 Go 产物统一命中 glebarez 纯 Go sqlite 驱动
          # （见 internal/bootstrap/sqlite_driver_*.go 的 build tag 约束），
          # 所以这里只要 jsoniter，不能带 sqlite_cgo_compat。
          go build -tags=jsoniter -ldflags="$LDFLAGS" -o build/openlist .

      - name: Verify musl binary is static
        if: contains(matrix.target, '-musl')
        run: |
          set -e
          if readelf -l build/openlist | grep -q "Requesting program interpreter"; then
            echo "Dynamic binary detected: build/openlist"
            readelf -l build/openlist | grep "Requesting program interpreter" || true
            exit 1
          fi

      - name: Compress with UPX
        # 只对 linux 生效。windows 那条不做压缩：一是历史上被 xgo 交叉编译产物
        # 的 upx 问题波及过，二是压缩失败时这里是直接失败而非降级，
        # 先把 linux 跑通再说。
        # 顺序上放在链接性校验之后：先确认编译产物本身合格，再动它。
        if: ${{ matrix.compress == 'upx' && !contains(matrix.target, 'windows') }}
        run: |
          set -e

          # upx 缺失时先尝试装。装不上就报错退出 —— 不能"警告后跳过"：
          # 那会让 compress=upx 的变体实际产出未压缩产物，名不副实，
          # 而对比体积时又看不出来。fail-fast 已关，其它变体不受影响。
          if ! command -v upx >/dev/null 2>&1; then
            echo "upx 未安装，尝试安装..."
            sudo apt-get update -qq || true
            sudo apt-get install -y -qq upx-ucl || sudo apt-get install -y -qq upx || true
          fi
          if ! command -v upx >/dev/null 2>&1; then
            echo "::error::upx 不可用，无法产出压缩变体"
            exit 1
          fi
          upx --version

          before=$(stat -c %s build/openlist)
          # upx -9 是最高压缩级别，代价是压缩耗时长；对 CI 来说可接受。
          # 不做"预先探测能否压缩"的自检：upx 没有这种开关 ——
          # `upx -t` 是校验**已压缩**文件能否正确解压，对未压缩的二进制
          # 必然报 NotPackedException。能否处理这个格式，直接由下面这条
          # 命令的退出码回答（不支持的格式会报错退出，set -e 会中断）。
          upx -9 build/openlist
          after=$(stat -c %s build/openlist)
          echo "::notice::upx: $before -> $after bytes"

          # 压缩后再用 -t 校验产物：这才是 -t 的正确用法。
          upx -t build/openlist
          echo "::notice::upx: 压缩产物自检通过"

      - name: Report linkage and size
        # 链接方式靠推断，不能靠假设 —— 每次把实际结果打出来，
        # 顺便给出体积，便于各变体横向对比。
        env:
          BIN: build/openlist${{ contains(matrix.target, 'windows') && '.exe' || '' }}
        run: |
          set -e
          if [ ! -e "$BIN" ]; then
            echo "::error::expected artifact missing: $BIN"
            ls -la build/ || true
            exit 1
          fi
          echo "--- size ---"
          du -h "$BIN"
          case "$BIN" in
            *.exe)
              echo "::notice::linkage = (windows, skipped)"
              ;;
            *)
              if readelf -l "$BIN" | grep -q "Requesting program interpreter"; then
                echo "::notice::linkage = DYNAMIC"
                readelf -l "$BIN" | grep "Requesting program interpreter" || true
              else
                echo "::notice::linkage = STATIC"
              fi
              ;;
          esac
          ls -la build/

      # 产物不走 artifact 上传：只走 WebDAV(7z) 与 GitHub Release(7z)，
      # 顺带省下每次 run 约 0.9~1.3GB 的 artifact 占用。
      # 下方保留原步骤备查，需要临时走 artifact 调试时取消注释即可。
      #
      # - name: Upload artifact
      #   uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      #   with:
      #     name: openlist_${{ matrix.target }}_${{ matrix.frontend }}_${{ matrix.compress }}
      #     overwrite: true
      #     path: build/*

      - name: Stage artifact with descriptive name
        # 产物编译出来统一叫 openlist[.exe]，变体信息只存在于目录/文件名里。
        # 后续 7z 与 Release asset 的命名都从这里来，
        # 不带变体信息的话 25 个变体会同名互相覆盖。
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -e
          name="openlist_${TARGET}_${{ matrix.frontend }}_${{ matrix.compress }}"
          case "$TARGET" in
            *windows*) mv build/openlist.exe "build/${name}.exe"; echo "::notice::staged build/${name}.exe" ;;
            *)         mv build/openlist     "build/${name}";     echo "::notice::staged build/${name}" ;;
          esac

      - name: Compress to 7z
        # -mx=9 即 7-Zip 的 Ultra 等级（最高）。
        # 注意归档内只放裸文件名：若传 "build/xxx" 给 7z，包内路径会带上
        # build/ 前缀，解压出来多一层目录，所以先 cd 进 build 再压。
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -e

          # p7zip-full 提供 7z；较新的 Ubuntu 改用 7zip 包（提供 7zz）。
          if ! command -v 7z >/dev/null 2>&1; then
            sudo apt-get update -qq || true
            sudo apt-get install -y -qq p7zip-full || sudo apt-get install -y -qq 7zip || true
          fi
          # 7zz 是 7zip 包的二进制名，建个别名让后面统一用 7z。
          if ! command -v 7z >/dev/null 2>&1 && command -v 7zz >/dev/null 2>&1; then
            sudo ln -sf "$(command -v 7zz)" /usr/local/bin/7z
          fi
          command -v 7z >/dev/null 2>&1 || { echo "::error::7z 不可用"; exit 1; }
          7z | head -3

          name="openlist_${TARGET}_${{ matrix.frontend }}_${{ matrix.compress }}"
          # 文件名由上一步决定，直接按名字取，不用 ls 通配去猜：
          # 通配会按字母序静默挑中任意一个 openlist* 文件，挑错不报错。
          case "$TARGET" in
            *windows*) binname="${name}.exe" ;;
            *)         binname="${name}" ;;
          esac
          [ -f "build/${binname}" ] || {
            echo "::error::找不到待压缩产物 build/${binname}"
            ls -la build/ || true
            exit 1
          }

          ( cd build && 7z a -mx=9 "${name}.7z" "${binname}" )

          # 裸二进制不再需要：本 job 只传 7z，Release 也只收 7z。
          # 删掉可避免后续 build/* 通配符把它一起带走。
          rm -f "build/${binname}"

          before=$(stat -c %s "build/${name}.7z")
          echo "::notice::7z(${name}) = ${before} bytes"

      - name: Publish to GitHub Release
        # 产出永久公开直链，形如：
        #   https://github.com/cjd6568358/OpenList/releases/download/ci-<sha>/<asset>
        # 与 WebDAV 那步完全独立，互不影响。
        #
        # 与 proxy.txt 的先后关系：txt 里拼的就是这里的 asset URL。
        # 但生成 txt 已挪到 summarize job，靠 needs: build 保证本 job 全跑完
        # 才开始 —— 所以这里不需要关心顺序，只要不把上传挪到 job 外面即可。
        #
        # tag 用 ci-<commit>：每个 commit 一个 Release，永久归档、互不覆盖。
        # 因为 tag 里已含 commit，asset 名就不再重复带 commit，与 WebDAV 上
        # 的文件名保持一致，便于两边对照。
        #
        # ⚠ 25 个 matrix job 并发跑这一段，必然有多个 job 同时想创建同一个
        #   Release。谁先谁赢，其余拿到 422 —— 那不是错误，故显式容忍。
        #
        # GITHUB_SHA / GITHUB_REF_NAME / GITHUB_EVENT_NAME 由 runner 提供。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.short-sha.outputs.sha }}
          MATRIX_DESC: ${{ matrix.target }} / ${{ matrix.frontend }} / ${{ matrix.compress }}
        run: |
          set -e
          tag="ci-${SHA}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag 已存在，直接补传 asset"
          else
            # --target 必须显式指定：不指定的话 gh 会把 tag 打在默认分支的
            #   最新提交上，而不是本次构建的 commit。
            # --prerelease：CI 产物不该被标成 "Latest release"。
            if ! gh release create "$tag" \
                 --title "CI build ${SHA}" \
                 --prerelease \
                 --target "${GITHUB_SHA}" \
                 --notes "$(printf '由 build_minimal.yml 自动构建。\n\n- commit: %s\n- 分支: %s\n- 变体: %s\n- 触发: %s\n\nasset 为 7z 压缩包，内含对应的可执行文件。\n各文件名对应不同链接方式/前端/压缩组合。\nCI 产物未经发布流程验证，请自行核对。' \
                   "${GITHUB_SHA}" "${GITHUB_REF_NAME}" "${MATRIX_DESC}" "${GITHUB_EVENT_NAME}")"; then
              # 竞态：别的 job 抢先创建了。确认它确实存在即可继续。
              if gh release view "$tag" >/dev/null 2>&1; then
                echo "release 已由其它 job 创建，继续"
              else
                echo "::error::既无法创建也找不到 release $tag"
                exit 1
              fi
            fi
          fi

          # --clobber：同 commit 重跑时覆盖同名 asset，保证幂等。
          gh release upload "$tag" build/*.7z --clobber
          echo "::notice::release $tag 已更新"

      - name: Generate proxy download links (this variant)
        # 紧跟在自己的 gh release upload 之后：此时本变体的 asset 必然已存在，
        # 所以直接按名字拼链接，不去查 Release（省一次 API 调用）。
        # 目的：尽早给出可用的加速下载地址 —— 不必等 25 个变体全跑完。
        # ⚠ 必须排在 Publish to GitHub Release 之后，否则是死链。
        env:
          SHA: ${{ steps.short-sha.outputs.sha }}
          TARGET: ${{ matrix.target }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          name="openlist_${TARGET}_${{ matrix.frontend }}_${{ matrix.compress }}"
          bash .github/scripts/gen-proxy-txt.sh \
            "ci-${SHA}" "${REPO}" "build/${name}.txt" "${name}.7z"

      - name: Upload to WebDAV
        # 脚本在 WEBDAV_URL 未配置时会打 notice 并成功退出，不会挂掉 job。
        # 布局：<WEBDAV_DIR>/<commit>/
        #   openlist_<target>_<frontend>_<compress>.txt   本变体的加速下载地址
        #   openlist_<target>_<frontend>_<compress>.7z    压缩后的产物
        # commit 作为目录层：按构建批次归档，便于翻查/回滚。
        # 同 commit 重跑会覆盖同名文件（幂等），不会堆积。
        #
        # 上传顺序先 txt 后 7z：txt 是个小文件，先落地能让"地址可用"更早，
        # 不必等 7z 那一大块传完。txt 里的链接指向 Release 而非 WebDAV，
        # 所以这个顺序不影响正确性。
        #
        # ⚠ 这些单变体 txt 只是**过渡产物**：summarize 会在全部变体跑完后
        #   把它们删掉，换成汇总版的 proxy.txt。见文件末尾。
        env:
          WEBDAV_URL: ${{ secrets.WEBDAV_URL }}
          WEBDAV_USERNAME: ${{ secrets.WEBDAV_USERNAME }}
          WEBDAV_PASSWORD: ${{ secrets.WEBDAV_PASSWORD }}
          WEBDAV_REMOTE_DIR: ${{ vars.WEBDAV_DIR }}/${{ steps.short-sha.outputs.sha }}
          TARGET: ${{ matrix.target }}
        run: |
          set -e
          name="openlist_${TARGET}_${{ matrix.frontend }}_${{ matrix.compress }}"
          bash .github/scripts/upload-webdav.sh "build/${name}.txt" "build/${name}.7z"

  summarize:
    # 等 build 全部跑完（无论成败）再执行。
    # always() 是必须的：不加的话任一变体失败就整片跳过，
    # 而「部分变体失败 + 其余成功的产物」正是最需要清单的时候。
    # 失败变体不会出现在 Release 里，所以清单自动只含成功产物。
    #
    # 职责：(1) 生成并上传汇总版的 proxy.txt
    #       (2) 把 proxy.txt 正文发一封邮件
    #       (3) 删掉 build 阶段各变体传的单变体 txt
    # 顺序是「先生成并上传、再发信、最后删除」：删除是破坏性且不可恢复的，
    # 排在最后，任何前面出错时旧清单都还在。
    # 放在 build 跑的过程中，WebDAV 目录里是 25 份单变体 txt ——
    # 那是刻意的过渡态：让加速地址尽早可用，不必等全量构建结束。
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - uses: benjlevesque/short-sha@dbe07338b37c456ce06d23409b35a56a7815eef4 # v4.0
        id: short-sha

      - name: Generate proxy download links
        # 一次性为该 Release 里的**全部**产物生成一份 txt，按代理域名分组。
        # 产物清单由脚本问 GitHub 要（gh release view），不写死。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.short-sha.outputs.sha }}
        run: |
          set -e
          bash .github/scripts/gen-proxy-txt.sh "ci-${SHA}" "${REPO}" proxy.txt

      - name: Upload to WebDAV
        # proxy.txt -> <WEBDAV_DIR>/<commit>/proxy.txt
        # 与各变体 7z 落在同一 commit 目录下，便于一起翻查。
        # 脚本在无产物时不生成文件，这里先判存在再交给上传脚本。
        env:
          WEBDAV_URL: ${{ secrets.WEBDAV_URL }}
          WEBDAV_USERNAME: ${{ secrets.WEBDAV_USERNAME }}
          WEBDAV_PASSWORD: ${{ secrets.WEBDAV_PASSWORD }}
          WEBDAV_REMOTE_DIR: ${{ vars.WEBDAV_DIR }}/${{ steps.short-sha.outputs.sha }}
        run: |
          set -e
          if [ ! -f proxy.txt ]; then
            echo "::notice::未生成 proxy.txt（release 无 7z 产物），跳过上传"
            exit 0
          fi
          bash .github/scripts/upload-webdav.sh proxy.txt

      - name: Send proxy.txt by mail
        # 正文就是 proxy.txt 原文，方便不翻 WebDAV 也能拿到加速地址。
        # 排在 proxy.txt 上传之后 —— 邮件里说的内容此时确实已经在 WebDAV 上。
        #
        # continue-on-error：邮件只是通知，不该拖累构建结果，更不该因为它失败
        # 就跳过后面那步破坏性的清理（删除排在最后，见下）。
        # 配置不全时脚本自己打 notice 后返回 0，不影响任何人。
        #
        # 配置来源：服务器/端口/发件地址放 vars（非敏感，且写错了能在
        # Settings 里直接读回来排查）；账号密码放 secrets。
        # SMTP_PORT 可留空，脚本默认 465（隐式 SSL）；其它端口走 STARTTLS。
        continue-on-error: true
        env:
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_SUBJECT: OpenList CI 构建产物 ${{ steps.short-sha.outputs.sha }}
        run: python3 .github/scripts/send-mail.py

      - name: Remove per-variant txt files
        # build job 为了「尽早给出下载地址」各传了一份单变体 txt，
        # 汇总版现在已经落地，把它们删掉 —— 同一个目录里两份语义重叠、
        # 格式不同的清单会让人不知道该信哪个。
        #
        # 排在 proxy.txt **上传之后**，不是生成之后：这样任何时刻目录里
        # 至少有一份可用清单。若本步排在前面，一旦上传那步失败（网络/凭据），
        # 旧的单变体 txt 已删、新的还没上去，就什么都不剩了。
        #
        # 名单从 Release 的 asset 推导：build job 只在 Release 上传成功后
        # 才写 txt，所以「有 7z 的变体」恰好是「可能有 txt 的变体」这个全集。
        # 失败变体没传过 txt，DELETE 会 404，脚本按预期容忍。
        # 这样就不必用 PROPFIND 去扫目录（bash 里解析 XML 很脆）。
        #
        # ⚠ 若 proxy.txt 因故没生成（Release 里一个 7z 都没有），
        #   这里也会因名单为空而跳过 —— 不会把仅有的东西删掉。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.short-sha.outputs.sha }}
          WEBDAV_URL: ${{ secrets.WEBDAV_URL }}
          WEBDAV_USERNAME: ${{ secrets.WEBDAV_USERNAME }}
          WEBDAV_PASSWORD: ${{ secrets.WEBDAV_PASSWORD }}
          WEBDAV_REMOTE_DIR: ${{ vars.WEBDAV_DIR }}/${{ steps.short-sha.outputs.sha }}
        run: |
          set -e
          # .7z -> .txt 映射出待删名单。Release 不存在或无产物时为空，
          # 删除脚本会打 notice 后正常退出。
          txts="$(gh release view "ci-${SHA}" --repo "${REPO}" --json assets --jq '.assets[].name' 2>/dev/null \
            | grep '\.7z$' | sed 's/\.7z$/.txt/' | sort || true)"

          if [ -z "$txts" ]; then
            echo "::notice::无变体产物，跳过清理单变体 txt"
            exit 0
          fi

          # shellcheck disable=SC2086  # 需要按空白拆分成多个参数
          bash .github/scripts/upload-webdav.sh --delete $txts
